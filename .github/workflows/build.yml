name: Enkiama build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enkiama-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: enkiama-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
